; AC8 Survival Mode: every subtitle line, in one file
; ======================================================================================================================
; Edit any line, save this file, then start the game again: the new lines show from then on.
;
; A line is   SPEAKER|what they say
;   SPEAKER is a short code (the name lists say who each one is: [hud.subs.speakers] at the end, the escort's staff,
;   GONE FISHIN''s and THE FESTIVAL's sal / control / tower / crew) or a name, shown as it is. Keep the | after it.
;   Words in {curly brackets} ({name}, {dir}, {n}, ...) are filled in by the game: leave them as they are.
; A [section] is one list of lines. Its lines, top to bottom, become that list: change them, add new ones, take some
;   out, move them around. The game picks one line of a list, or says them all in order, depending on the moment.
;   A section whose name ends in a number (.1, .2, ...) is one exchange (said together, in order); a section with the
;   next number adds an exchange. A section with only a  -  line takes that list or exchange out.
;   A section left out of this file keeps the game's own lines.
; name = text   changes one line held under a name, or who a speaker code is (in the name lists).
; Lines starting with ; are notes, skipped.
;
; Mistakes are skipped, never fatal: the game's log (logs\AC8SurvivalMode_lua_<date>.log) lists each one as "subtitles: line N: ...".
; Every Survival Mode update brings this file and replaces the one here: send your changes to the mod's author
; (@voidcallsreaper on Discord) before you install a new version. Delete it to get the game's own lines back: the game
; writes it again when it starts.


; ====================================================================================================================
; OTHER LINES
; ====================================================================================================================

[specials.fleet.round.phase2.cine.beats.5]
say = VALKA|That's her. The heart of it. Emblem Direct tore the door open, and she came through.

[specials.fleet.round.phase2.radio.beaten]
CTRL|Her guns are silent. She's going under!
VALKA|...She's quiet now. The captain can rest.
AUDREY|Rest easy, Tanager.

[specials.fleet.round.phase2.radio.core]
CTRL|Her core is exposed! Everything you've got, right now!
VALKA|Her heart is open. The captain is waiting.

[specials.fleet.round.phase2.radio.fall]
CTRL|GEOFON's breaking in two! Something's... coming up between the halves!
VALKA|There. That's what I felt. That's the Tanager.

[specials.fleet.round.phase2.radio.half]
CTRL|Half her guns are gone. Keep hammering her!
VALKA|She's hurting, Audrey. Her captain is still inside her.

[specials.fleet.round.phase2.radio.phase2]
CTRL|Her bow is opening... that's a railcannon! It's aiming at the airfield!
AUDREY|It's aiming at the airfield, Val. Hold on tight.

[specials.fleet.round.phase2.radio.rises]
CTRL|That's not a ship. That's the TANACORN! All units, take out her guns!
AUDREY|What the hell did Emblem Direct do?

[specials.fleet.round.radio.geofon]
CTRL|GEOFON is going down! The carrier's finished!

[specials.fleet.round.radio.half]
CTRL|Half of the fleet's on the bottom. Keep at them!
AUDREY|I am still not over the fact that they have fucking lasers. Back in the day, we'd kill just to have one of them!

[specials.fleet.round.radio.sighted]
CTRL|They came up out of the sea... the whole fleet. Break them before they reach the airfield.
VALKA|The void let them go, Auds. All of them at once.
AUDREY|Fourteen escorts and the carrier, GEOFON.
AUDREY|I think we're missing one.

[specials.fleet.round.radio.stage1]
AUDREY|Stars, GEOFON's burning! Keep pouring it on!
AUDREY|Though I can't help but wonder where the elusive battleship is...
VALKA|Stop looking for the Tanager on the water, Audrey. Look under it.
AUDREY|...you're kidding right? I can't see anything with how dark it is!

[specials.fleet.round.radio.stage2]
VALKA|The carrier's hurting her, Audrey. She's pressed right up underneath it, trying to get out.
AUDREY|Wait, you mean RIGHT under?!
AUDREY|Uhh, friendly advice to all pilots, you may want to back up. Just a smidge.

[specials.fleet.round.radio.tanager]
AUDREY|The Tanager is still missing. Where could it be?
VALKA|I feel its presence close. The captain's soul is hurting.

[specials.fleet.round.radio.warn]
CTRL|All units, Comona Control. Long-range radar has a surface group under way, bearing three-one-five.
CTRL|Fifteen contacts in formation. It's the Aegir Fleet, and it's coming straight for us.
AUDREY|You're kidding right? An entire fleet?
VALKA|It's not a fleet, Audrey. It's an Anomaly. Emblem Direct opened a door, and the Void is pushing them through.

[specials.fleet.round.radio.won]
CTRL|That's the last of them. The Aegir Fleet is destroyed. Ground crews, get that runway back in shape.
VALKA|Audrey, look. The sun's coming up.
AUDREY|I was honestly worried we'd never see it again.
VALKA|You, of all people, scared?
AUDREY|Hey, I'm only human!

[specials.fleet.shell.radio.shelling]
CTRL|Incoming! Naval gunfire on the airfield! The fleet's in range!
AUDREY|Shells on the runway! Val, head down! Someone sink those ships already!
[specials.fleet.surface.beats.2]
say = CHARLENE|Comona, Charlene. Kokoda's instruments are screaming. There's an Anomaly under the sea.

[specials.fleet.surface.beats.3]
say = CTRL|Contacts surfacing! Multiple contacts, they're coming up out of the sea!

[specials.fleet.surface.beats.6]
say = VALKA|They're all waking up, Audrey. The Void doesn't want them anymore.

