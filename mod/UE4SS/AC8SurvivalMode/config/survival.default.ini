; AC8 Survival Mode settings  (survival.ini format 2)
;
; Edit survival.ini (next to this file), not this one: survival.default.ini is replaced by every update, survival.ini
; never is. survival.ini is made from this file the first time Survival Mode runs; delete it to get a fresh one.
;
; Every setting below is shown with its default, switched off by the ; in front of it. To change one, remove that ;
; and edit the value. Settings you leave switched off follow the mod's defaults, also when an update changes them.
; Restart the game after a change. The "config:" line in ue4ss\UE4SS.log (and AC8SurvivalMode\AC8SurvivalMode_lua.log)
; says how many settings were used and names any line that wasn't.
; Issues: @voidcallsreaper on Discord.

[rounds]
; the round a run starts at (for testing later rounds: 16 brings the named aces)
;start_round         = 1
; seconds before round 1, and the break between rounds
;first_round_delay_s = 15
;intermission_s      = 20
; seconds between two squadrons of the same round arriving
;spawn_gap_s         = 3
; enemy aircraft in round 1, added every round, and the most in one round (difficulty spikes included)
;aircraft_round1     = 4
;aircraft_per_round  = 2
;max_aircraft        = 60
; where squadrons appear: distance from the airfield (km, min, max) and altitude (m, min, max)
;distance_km         = 18, 25
;altitude_m          = 2000, 4500
; fighter types drawn at random for each squadron
;aircraft            = f16c_common, f18e_common, f15e_common, f14d_common, m21b_common, m29a_common, m31b_common, su33_common, su34_common

[squadrons]
; squadron size = the first round it can appear in
;2 = 1
;4 = 4
;6 = 8

[zollars]
; zollars at the start of a run, per kill by type, and the bonus per round cleared (x the round number)
;start       = 0
;fighter     = 100
;bomber      = 200
;heavy       = 400
;round_bonus = 100
; kill pay x this for the enemy's skill tier: Rookie, Regular, Veteran, Elite, Ace, Mercenary, Legend, Demon, Phantom, Reaper
;tier_pay    = 1.0, 1.1, 1.25, 1.4, 1.5, 1.6, 1.7, 1.8, 1.9, 2.0

[shop.missiles]
; landing doesn't rearm: ammo is only what you take off with plus what you buy here (up to the aircraft's full load).
; price of a pack, step = how many it adds; raise > 1 makes each purchase that many times dearer than the last
;price = 300
;step  = 12
;raise = 1.0
[shop.special]
;price = 400
;step  = 4
;raise = 1.0
[shop.flares]
;price = 150
;step  = 2
;raise = 1.0
[shop.repairaircraft]
; the STORE's aircraft repair (to full health): price for a repair from 0%, scaled by the damage, at least min_price
;price     = 600
;min_price = 100

[shop.repairairfield]
; the STORE's airfield repair: health restored per purchase, price, and each purchase raise times dearer
;repair = 25
;price  = 300
;raise  = 1.0

[shop.airfield]
; repair = airfield health restored per purchase
;price  = 300
;repair = 25
;raise  = 1.0


[shop.airfield.defences.aa]
; once the airfield is at full health its shop row builds defences instead: Mission 22's 5 AA guns around the airport
;price = 4000
;raise = 1.25

[shop.airfield.defences.sam]
; and its 2 SAM sites
;price = 8000
;raise = 1.25

[shop.moonchild]
; the STORE's AIRFIELD page: squadron MOONCHILD, two F-22s that take off from the airfield once you're airborne
;price = 15000
;raise = 1.25

[shop.shipaegis]
; the STORE's DOCKS page: an Aegis destroyer that sails the waters by the airfield (up to four at sea)
;price = 20000
;raise = 1.25

[allies]
; false: the STORE sells no allied aircraft or ships
;enabled      = true
; the share of enemy fighter flights that go for MOONCHILD while it flies
;hunt_share   = 0.5
; while allied ships are at sea, this share of a normal round's aircraft are strike flights sent at them
;strike_share = 0.25

[allies.fcs]
; every allied weapon: lock-on range x range_x, its cone x angle_x, lock, aim and reload times x time_x (smaller is
; quicker), gun spread x spread_x (smaller is more accurate)
;range_x  = 1.6
;angle_x  = 1.5
;time_x   = 0.5
;spread_x = 0.4

[allies.aircraft]
; the allied F-22s' squadron name, and the gap between two of its flights taking off
;name          = MOONCHILD
;takeoff_gap_s = 45

[allies.ships.aegis]
; the name shown on the allied ships
;name = DDG AEGIS

[allies.ships.aegis.fcs]
; the Aegis's weapons on top of [allies.fcs]: arming and lock-on times x lock_x, time between shots and rest x fire_x
; (smaller is quicker); lock-on range x range_x of the stock range (in place of [allies.fcs] range_x)
;lock_x  = 0.5
;fire_x  = 0.5
;range_x = 2.0
[ammo]
; true lets the game refill missiles over time, as in the campaign
;free_restock = false

; ammo you start a run with, by the game's difficulty (landing doesn't refill it: buy more at the airfield)
[ammo.casual]
;missiles = 72
;special  = 56
;flares   = 6

[ammo.standard]
;missiles = 48
;special  = 28
;flares   = 4

[ammo.ace]
;missiles = 30
;special  = 14
;flares   = 3

[airfield]
; false: no airfield health and no bomber raids
;enabled    = true
;hp         = 100
; health lost per enemy weapon that hits it
;hit_damage = 4
; health it comes back with after going down
;repair_hp  = 50

[bombers]
; the first bomber raid round, then every raid_every rounds; raid_share = part of that round's aircraft that are bombers
;first_raid       = 3
;raid_every       = 3
;raid_share       = 0.65
; Tu-95 / Tu-160 from this round on
;heavy_from_round = 3
; airfield health a heavy bomber run takes
;bomb_damage      = 12
;distance_km      = 28, 36

[spikes]
; difficulty spikes: every `every` rounds (rounds 8, 15, 22) enemies get sharper across the board: quicker missile
; locks and gun aim, better accuracy, higher pilot skill, post-stall moves on every airframe, more aircraft
;enabled = true
;every   = 7

[specials]
; special rounds: false = every round is a normal one. The first special round, then one every `every` rounds
;enabled = true
;first   = 5
;every   = 5

; the special rounds in turn, from `first`: shuttle (Comona Defense), anomaly (The Anomaly)
;rotation = shuttle, anomaly

[specials.anomaly]
; The Anomaly: the ace MINDRIPPER in an F-4E with its guards. Within field_km of it your controls invert ("both",
; "pitch" or "roll"), fading over fade_s seconds; shoot it down for `reward` zollars and your controls come back
;name        = MINDRIPPER
;guards_name = PHANTASM
;field_km    = 3.2
;invert      = both
;fade_s      = 1.5
;reward      = 4000
; plus this x the round number
;reward_per_round = 150
; true: its round has only MINDRIPPER and its guards
;only        = true
; MINDRIPPER's extra health (an F-4E has 60), and whether it hovers in place (its speed x hover_speed)
;health_add  = 440
;hover       = true
;hover_speed = 0.06
; the camera that swings onto it as it arrives: LookAt_Event_Camera, LookAt_Event_Camera_ms08-01,
; LookAt_Event_Camera_ms04-01, LookAt_Event_Camera_ms23-01 (wide) or LookAt_Event_Camera_ms22-01 (the shuttle's)
;camera      = LookAt_Event_Camera_ms22-01
; how far from you its portal opens (km, nearest and farthest; the camera zooms in more the farther it is). Off: like
; any other flight, 18-25 km from the airfield (0, 0); e.g. 8, 12
;spawn_km    = 0, 0

[specials.shuttle]
; Comona Defense: defend the shuttle on its pad until it lifts off (the countdown is 150 s, built into the mod)
;name               = EMBDIR Shuttle - CORRIS
; zollars for a liftoff (plus reward_per_round x the round number), and how many rounds the shop stays closed if the
; shuttle is lost
;reward             = 3000
;reward_per_round   = 100
;shop_closed_rounds = 1
; part of the round's aircraft that are strike flights sent at the shuttle
;strike_share       = 0.4

[ai]
; true: enemy fighters fly Survival's own pursuit, which tries to sit on your tail more the better the pilot is
; (rookies rarely, veterans mostly, aces always); false: the game's stock fighter pursuit
;tail_chase = true
; true: their reactions are Survival's too: when you're on their tail they break, brake to make you overshoot or flare,
; and from the Mercenary rank up cobra / kulbit bait and scissors; escaping, better pilots make a sharp 2 s break
;reactions  = true

[skill]
; chance that a pilot flies one skill tier above the round's
;promote_chance = 0.2

[skill.difficulty]
; enemy pilot skill added per difficulty (-1 easier, +1 harder)
;casual   = -1
;standard = 0
;ace      = 1

[aces]
; named aces: on ace rounds (round 16, then every 3rd) enemy fighters fly their rank's squadron, wingmen under the
; squadron's name and the lead under an ace's own (each ace leads one flight at a time). false: no ace rounds
;enabled = true
; ace rounds: from first_round, every `every`th round is one (only ace squadrons, no bomber raid); the rounds between
; are normal rounds flown by equally skilled pilots in ordinary aircraft
;first_round = 16
;every       = 3
; true: an "ACE INBOUND" callout the first time each ace shows up in a run
;callout = true
; true: the ADFX-02 (an Online Mode airframe, brought into Survival) flies with the Reaper aces; false leaves it out
;online_aircraft = true

; the names. Each name flies the airframe its key says (fixed; the skins are the game's squadron and ace skins).
; Changes need a game restart.
[aces.mercenary]
; rounds 16+: F-15C (Shark skin), Su-35 (Ventus skin), Typhoon
;squadron = Bounty
;f15c     = Ledger
;su35     = Wager
;typhoon  = Payday

[aces.legend]
; rounds 19+: Su-47, Rafale (Savia skin)
;squadron = Valkyrie
;su47     = Sigrun
;rafale   = Brynhild

[aces.demon]
; rounds 22+: F-22A, Su-57 (Ares skin)
;squadron = Inferno
;f22a     = Mephisto
;su57     = Belial

[aces.phantom]
; rounds 25+: Shadow squadron Su-57, Typhoon and Su-47
;squadron = Wraith
;su57     = Specter
;typhoon  = Revenant
;su47     = Banshee

[aces.reaper]
; rounds 28+: the campaign's named-ace Su-57, F-22A, Typhoon and Rafale, with a Shadow escort, and the ADFX-02
;squadron = Harvest
;su57     = Grim
;f22a     = Scythe
;typhoon  = Charon
;rafale   = Nightfall
;adfx02   = Oblivion

[enemy_missiles]
; enemy missile lock: range (m), cone (degrees), seconds to lock, seconds between missiles, rest after a volley
;capture_m  = 4000
;angle_deg  = 60
;lock_s     = 1.5
;interval_s = 2.0
;rest_s     = 5.0

[enemy_guns]
; enemy guns: range (m), cone (degrees), seconds on target before firing, rounds per burst, damage x, spread (degrees)
;range_m    = 2000
;angle_deg  = 40
;aim_s      = 0.8
;burst      = 15
;damage_x   = 1.5
;spread_deg = 1.5

[hud]
; false hides Survival's ROUND / ZOLLARS / AIRFIELD rows and callouts
;enabled = true

[music]
; the Music Player row in the pause menu
;pause_player = true
; true keeps the Music Player's track from ending early after you pause
;hold_clock = true
