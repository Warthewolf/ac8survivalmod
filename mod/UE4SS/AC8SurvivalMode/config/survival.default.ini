[aces.personality]
; each squadron fights its own way and shows it within seconds of meeting you: Bounty comes from above with a missile
; each, Valkyrie's pack holds back its trap and springs it, Inferno kulbits as one, Wraith's lead blinks onto your six,
; Harvest does all of it (and still turns on you). false: the squadrons fly as before (the duelists' behaviour, no
; openers or blinks). tells: each squadron's radio call when you first meet it
;enabled        = true
;tells          = true
; a blink never ends closer to the ground than this (m; less when you fly lower), with smoke where it left and came out
;ground_clear_m = 150
;smoke          = true

[aces.personality.openers.high]
; "high": the flight comes in alt_add_m higher (up to top_m; a Lancer flight already flies 2 km higher), and once it's
; within km of you up to salvo of its planes within range_km fire a missile each, gap_s apart (0 salvo: none)
;km        = 5.0
;alt_add_m = 2000
;top_m     = 4500
;salvo     = 2
;gap_s     = 0.6
;range_km  = 5.0

[aces.personality.openers.trap]
; "trap": a Wolf pack holds back its trap (every second plane) and springs it spring_s after it's within km of you (a
; "trap" call first); not held yet, it waits up to wait_s more. It's held until then, but let go hold_max_s after its
; hold if it hasn't met anyone (0: let go as any Wolf pack's, [roles.wolf] hold_max_s). A flight that isn't a Wolf pack
; turns on you instead
;km         = 4.0
;spring_s   = 8
;wait_s     = 15
;hold_max_s = 300

[aces.personality.openers.kulbit]
; "kulbit": the whole flight kulbits as one (firing its specials) once it's within km of you
;km        = 2.5

[aces.personality.openers.blink]
; "blink": its lead blinks to a spot 1 km behind and beside you once it's within km of you
;km        = 4.0

; each squadron's behaviour on its ace round: roles, the share of its flights from each fighter role ([roles]: duelist
; (the only one whose aces tail-chase hardest at the top ranks), lancer, wolf, skirm); openers, what its flights show
; when they first reach you, in turn (high, trap, kulbit, blink; a blink only on a duelist flight; none: only its
; call); blink, its lead blinking onto your six while you sit on its tail (within tailed_km and tail_deg; on_hit: or
; when you hit it), at most every every_s, its flight's reversals no sooner than move_gap_s after
