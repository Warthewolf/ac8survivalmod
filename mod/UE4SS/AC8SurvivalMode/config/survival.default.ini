[menu]
; the game's own main-menu entries Survival takes off the menu (ACE COMBAT STORE = Shop, ACE COMBAT ONLINE = Online,
; CAMPAIGN TRAINING = CampaignTraining). Set hide_stock = false to keep them all.
;hide_stock = true
;hide       = Shop, Online, CampaignTraining
; Survival's own menu pages: SURVIVAL MODE opens SP OFFLINE, SP ONLINE, COOP HOST and COOP JOIN, each but JOIN with its
; own setup page and MORE RULES. pages = false: the flat rows instead (SURVIVAL MODE, SURVIVAL CO-OP: HOST / JOIN, each
; straight to the difficulty select). late_register: when the game listed its main-menu pages before Survival's were
; in, put them in that list at once (false: they're there from the next time the main menu loads). last: the mode
; QUICK START plays (offline, online or host; set by the game when a run starts).
;pages         = true
;late_register = true
;last          =

[setup.offline]
; The run setups of Survival's menu pages, one per mode: SP OFFLINE, SP ONLINE and COOP HOST (which everyone who joins
; plays with). The pages change them in game and save them here:
;   preset       auto (by the difficulty you pick: Casual = casual, Ace = ace, the others standard), casual, standard
;                or ace: the ammo caps ([ammo.*]), enemy pilot skill and how many enemies fly at once
;   zollars      zollars at the start
;   enemies      how many enemy aircraft each round and wave brings, in % (50 to 200)
;   start_round  the first round (past 1, a run isn't sent to the leaderboard)
;   break_s      seconds between rounds
;   specials     normal, more (twice as often), fewer (half as often) or off
;   airfield     the airfield's health, in % of [airfield] hp
;   pay          every zollar you earn, in %
;   skill        added to every enemy pilot's rank: -1 easier, 0, 1 harder, 2 brutal
; ONLINE ONLY BEGIN
; An SP ONLINE run goes to the leaderboard only with these defaults (other rules make it unranked).
; ONLINE ONLY END
;preset      = auto
;zollars     = 0
;enemies     = 100
;start_round = 1
;break_s     = 20
;specials    = normal
;airfield    = 100
;pay         = 100
;skill       = 0

; ONLINE ONLY BEGIN
[setup.online]
;preset      = auto
;zollars     = 0
;enemies     = 100
;start_round = 1
;break_s     = 20
;specials    = normal
;airfield    = 100
;pay         = 100
;skill       = 0
; ONLINE ONLY END

[setup.host]
;preset      = auto
;zollars     = 0
;enemies     = 100
;start_round = 1
;break_s     = 20
;specials    = normal
;airfield    = 100
;pay         = 100
;skill       = 0

[leaderboard]
