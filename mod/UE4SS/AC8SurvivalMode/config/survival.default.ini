[profile]
; the learning layer: the enemies learn how you fly and counter it. Your own kills of fighters (not bombers, Ladons or
; specials) and where you fly make five habits, each a share 0-1 ([profile.missile] etc.): missile-heavy, gun / close
; fights, tail chasing, staying high, hugging the airfield. One over its threshold is countered from the next round,
; the more the further over it. Kept across runs in config\survival_profile.ini (made by the game at your first run's
; end; delete it, and any survival_profile.ini.tmp / .bak beside it, to start over; never sent, never shared in
; co-op), read at each start, written at each run's end (checkpoint: and at each round's end, so a crash doesn't lose
; the run). A file the game can't read as a profile is kept as survival_profile.ini.old. This run's own shares count
; once each has live_kills of the kills it comes from (missile: your kills with a weapon seen; behind: those with an
; aspect) and live_samples 2 s samples of flying for the time habits, weighed against your saved profile as if it were
; prior_kills kills (prior_samples samples). A run of fewer than min_kills of your kills of fighters, or one started
; past round 1 (in co-op, joined past round 1), is counted but not learnt from (its time habits and height only with
; min_samples samples); each share of a run weighs n / (n + fold_kills) in the profile, n its own count
; (n / (n + fold_samples) for the time habits), at most run_weight_max.
; In co-op the host's habits pick the room's counters. false: no learning, no counters. save = false: each run learns
; on its own
;enabled        = true
;save           = true
;checkpoint     = true
;min_kills      = 8
;min_samples    = 60
;live_kills     = 5
;live_samples   = 30
;prior_kills    = 20
;prior_samples  = 150
;fold_kills     = 30
;fold_samples   = 300
;run_weight_max = 0.5

