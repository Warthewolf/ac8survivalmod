; AC8 Survival Mode settings  (survival.ini format 2)
;
; Edit survival.ini (next to this file), not this one: survival.default.ini is replaced by every update, survival.ini
; never is. survival.ini is made from this file the first time Survival Mode runs; delete it to get a fresh one.
;
; Every setting below is shown with its default, switched off by the ; in front of it. To change one, remove that ;
; and edit the value. Settings you leave switched off follow the mod's defaults, also when an update changes them.
; Restart the game after a change. The "config:" line in ue4ss\UE4SS.log (and AC8SurvivalMode\AC8SurvivalMode_lua.log)
; says how many settings were used and names any line that wasn't.
; Issues: @voidcallsreaper on Discord.

[coop]
; Survival COOP: up to 24 players, one run. One of you is the host (their game runs the rounds and the enemies), the
; others join (they see the host's enemies and rounds, and each other; each earns their own zollars). The host picks
; SURVIVAL MODE > SURVIVAL MODE COOP HOST on the main menu, everyone else SURVIVAL MODE COOP JOIN (without Survival's
; menu pages: SURVIVAL CO-OP: HOST / JOIN; they're there when enabled, nothing below is needed). The COOP HOST page's
; rows change CO-OP ROOM (max_players) and CO-OP ENEMIES (aircraft_per_player) in game and save them here; its other
; rules are [setup.host]. In co-op everyone plays with the host's settings, all but each player's own [coop], [hud],
; [music], [menu], [leaderboard] and sound settings.
; enabled: true in the Survival COOP build. role: only for an older main.dll without the HOST / JOIN entries.
;enabled   = true
;role      = auto
; transport: steam (all on Steam, each joiner a Steam friend of the host) or udp (same network, or a VPN like Radmin /
; ZeroTier / Tailscale). partner: for steam, auto (your Steam friends playing ACE COMBAT 8), or Steam names / SteamID64s
; separated by commas (a joiner names the host; the host may name its joiners). For udp, the joiners set the host's IP
; address (the host leaves it as auto) and the host lets UDP port `port` through its firewall, for the LAN or VPN only:
; anyone who can reach that port can join, so never forward it from the internet (Steam needs no port).
;transport = steam
;partner   = auto
;port      = 27777
; your name on the other players' screens ("<NAME> JOINED"), up to 20 characters; left out: your Steam name
;name      = Reaper
; how far behind the other game the other planes are drawn, in ms (more = smoother over a bad connection)
;interp_ms = 120
; the other players as their own aircraft (the ADFX-02 too), as AC8's Online Mode shows them: true. false: an AI copy of
; their aircraft type, as before (also used when theirs can't be shown: an older build)
;real_planes = true
; their damage shown on their real plane here (health as their game says; it never goes down here)
;real_damage = true
; the host's round waits (no new enemies) while a linked player is still joining, each at most this many seconds; 0: never
;join_wait_s = 90
; their paint (skin and emblems) on their real plane here; false: each airframe's default
;real_paint = true
; the share of the host's fighter squadrons that go after the joiner. While the host is down at the airfield, new
; enemies keep coming as long as another player is flying (alone, they wait for the host's takeoff)
;split_share = 0.5
; how many players the host's game takes, you included (2 to 24)
;max_players = 24
; more players, more enemies: each player past the first adds this share to a round's aircraft (0.15: 4 players get
; 1.45 times as many), up to max_aircraft in a round and max_up flying at once (never fewer than one player gets;
; from [late] aircraft_from_round max_aircraft grows as one player's rounds do, up to [late] coop_max_aircraft).
; 0 = a single player's rounds.
;aircraft_per_player = 0.15
;max_aircraft = 60
;max_up = 30
; the host's round callouts on the joiner's screen too
;callouts  = true
; co-op runs aren't sent to the leaderboard
;leaderboard = false

[coop.migration]
; when the host's game goes (it crashed or quit), the player with the best connection takes over as host and everyone
; else joins them by themselves: the round in play starts again, the allies and the airfield's defences are built again,
; and everyone keeps their zollars. after_s: how long the host must be silent first (a run's end, when the host's level
; reloads, waits longer); link_s: how long each next host is waited for; wait_s: how long the new host's round waits for
; everyone to be back; break_s: the break before that round. Steam only.
;enabled = true
;after_s = 30
;link_s  = 20
;wait_s  = 60
;break_s = 15

[coop.sync]
; the other players' missiles, gun, flares, landing gear and afterburner shown on their planes on your screen (and yours
; on theirs). What their planes fire on your screen only shows: it does no damage here, each player's own hits count.
; ab_throttle: how far forward the throttle is (0 to 1) when you're on afterburner. enabled = false: none of it.
;enabled     = true
;missiles    = true
;guns        = true
;flares      = true
;gear        = true
;afterburner = true
;ab_throttle = 0.9

[coop.revive]
; Revives (co-op only): shot down, you're DOWN instead: your plane is held at floor_hp, flown round the airfield out of
; the fight, and you watch the other players (key: the next one; ctrl = true: Ctrl+key). Any other player who lands at
; their airfield buys you back from the STORE's AIRFIELD page (REVIVE <NAME>) for price zollars, raise times more for
; each revive in the run; you come back repaired, invincible for safe_s seconds, where you were flown (respawn = loiter)
; or 4 km out from the runway at 500 m (respawn = native). When every player is down, the run's over. A downed player
; keeps their zollars, items, upgrades and allies, and gets the round bonuses (down_round_bonus = false: not while
; down). The host's settings count for everyone, but key, ctrl and [coop.revive.camera] are each player's own.
; enabled = false: a shot-down player's run ends as in single player.
;enabled          = true
;floor_hp         = 0.1
;price            = 2500
;raise            = 1.25
;safe_s           = 5
;respawn          = loiter
; a revive farther than near_km from the airfield brings you back by the runway (native) instead
;near_km          = 8
; while you're down, a plane flown farther than drift_km from the airfield is put back over it
;drift_km         = 10
;key              = O
;ctrl             = false
;down_round_bonus = true

[coop.revive.loiter]
; where a downed plane is flown: round the airfield, alt_m up, radius_m round
;alt_m    = 2500
;radius_m = 4000

[coop.revive.camera]
; the spectator camera: back_m behind and up_m above the plane you watch; blend_s to swing over to it
;back_m  = 30
;up_m    = 8
;blend_s = 0.5

[rounds]
