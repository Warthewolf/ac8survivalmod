[waves]
; a round's aircraft come in waves of at most max_up (by the game's difficulty below; the special and the bombers in the
; first), the next once next_at or fewer are left (or, with timeout_s above 0, that many seconds after the last wave's
; last flight came, not counting time at the airfield unless another co-op player is flying; 0 = by kills only). false:
; all at once. Late rounds raise the most at once ([late] max_up_per_round, up to [late.max_up_cap])
;enabled   = true
;next_at   = 4
;timeout_s = 0
;callout   = true

[waves.max_up_by_preset]
;casual   = 14
;standard = 18
;ace      = 22

[late]
; from from_round on enemies get tougher: health x (1 + health_per_round a round past it, at most health_max_x), and
; the chance a pilot flies a skill tier higher + promote_per_round a round (at most promote_max)
;enabled           = true
;from_round        = 15
;health_per_round  = 0.045
;health_max_x      = 1.5
;promote_per_round = 0.03
;promote_max       = 0.6
; from aircraft_from_round the rounds grow again: [rounds] max_aircraft + aircraft_per_round a round, at most
; max_aircraft (30 to 60 by round 35); and the most flying at once ([waves.max_up_by_preset]) + max_up_per_round a
; round, at most [late.max_up_cap], so the extra aircraft come in more waves. In co-op the room's most ([coop]
; max_aircraft) grows as much, at most coop_max_aircraft. grow = false (or aircraft_from_round = 0): no growth
;grow                = true
;aircraft_from_round = 26
;aircraft_per_round  = 3
;max_aircraft        = 60
;max_up_per_round    = 1
;coop_max_aircraft   = 80

[late.max_up_cap]
;casual   = 20
;standard = 26
;ace      = 30

[late.pressure]
; the game's own limit on how hard the enemies press you at once (how many may attack you, how many of their missiles
; may be aimed at you, their attack cooldowns): preset B (6 attackers, 4 missiles) from the start, then from each
; from_round the preset at the same place in `preset`: A gentler (3 / 2), C 8 attackers / 6 missiles, D 10 / 8. Not in
; an Anomaly or VALKA round until its boss is down (they set their own). Needs [late] on. false: preset B all run
;enabled    = true
;from_round = 26, 31
;preset     = C, D

[late.director_pay]
