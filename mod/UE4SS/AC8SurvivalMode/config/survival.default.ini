[hud]
; false hides Survival's ROUND / ZOLLARS / AIRFIELD rows and callouts
;enabled = true

[hud.info]
; The info key: opens the info wall in the middle of the screen (press again to close it): every co-op player with
; their aircraft, what they're doing (flying, at the airfield, down) and their health, then your allies, your items and
; the run's kills. The CO-OP, ALLIES and ITEMS rows in the corner stay hidden; each shows for peek_s seconds when
; something in it changes (a player joins, drops or is shot down; an ally flight, ship or defence comes or goes, or the
; allies' order changes; an item bought or used). Only in a run. key: a letter, or another key name (F5, TAB, ...);
; ctrl = true: Ctrl+key. Keyboard only. The game still gets the key too: if it does something there, pick another.
; enabled = false: those rows always shown, no wall. start_open = true: the wall open as each level starts.
;enabled    = true
;key        = I
;ctrl       = false
;start_open = false
;peek_s     = 5

[music]
; the Music Player row in the pause menu
;pause_player = true
; true keeps the Music Player's track from ending early after you pause
;hold_clock = true
