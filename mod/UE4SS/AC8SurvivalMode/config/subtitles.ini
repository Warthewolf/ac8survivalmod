; AC8 Survival Mode: every subtitle line, in one file
; ======================================================================================================================
; Edit any line, save this file, then start the game again: the new lines show from then on.
;
; A line is   SPEAKER|what they say
;   SPEAKER is a short code (the name lists say who each one is: [hud.subs.speakers] at the end, the escort's staff,
;   GONE FISHIN''s and THE FESTIVAL's sal / control / tower / crew) or a name, shown as it is. Keep the | after it.
;   Words in {curly brackets} ({name}, {dir}, {n}, ...) are filled in by the game: leave them as they are.
; A [section] is one list of lines. Its lines, top to bottom, become that list: change them, add new ones, take some
;   out, move them around. The game picks one line of a list, or says them all in order, depending on the moment.
;   A section whose name ends in a number (.1, .2, ...) is one exchange (said together, in order); a section with the
;   next number adds an exchange. A section with only a  -  line takes that list or exchange out.
;   A section left out of this file keeps the game's own lines.
; name = text   changes one line held under a name, or who a speaker code is (in the name lists).
; Lines starting with ; are notes, skipped.
;
; Mistakes are skipped, never fatal: the game's log (logs\AC8SurvivalMode_lua_<date>.log) lists each one as "subtitles: line N: ...".
; Every Survival Mode update brings this file and replaces the one here: send your changes to the mod's author
; (@voidcallsreaper on Discord) before you install a new version. Delete it to get the game's own lines back: the game
; writes it again when it starts.


; ====================================================================================================================
; SHUTTLE LAUNCH: KASKA's intercepted channel (KASKA and EMBDIR LAUNCH)
; ====================================================================================================================

; specials.shuttle.subs.after: 1 exchange, each said together
[specials.shuttle.subs.after.1]
KASKA|Close the channel. If anyone was listening, I want their names.

; specials.shuttle.subs.hit: 3 exchanges, each said together
[specials.shuttle.subs.hit.1]
EMBDIR|We're taking hits on the pad!
KASKA|Then Comona's pilots are slower than I was promised.

[specials.shuttle.subs.hit.2]
KASKA|If the payload cracks, I want to know before anyone else does.

[specials.shuttle.subs.hit.3]
KASKA|War will be watching this feed. Don't give her the data.

; specials.shuttle.subs.launched: 3 exchanges, each said together
[specials.shuttle.subs.launched.1]
EMBDIR|Clean separation. The satellite's on its way.
KASKA|Good. Tell Sudentor the door is on schedule.

[specials.shuttle.subs.launched.2]
KASKA|Wipe the logs. As far as Comona knows, it was a weather bird.

[specials.shuttle.subs.launched.3]
KASKA|Keep those pilots flying. Some of our guests will want a rematch.

; specials.shuttle.subs.lost: 2 exchanges, each said together
[specials.shuttle.subs.lost.1]
EMBDIR|We lost it, sir. The payload's gone.
KASKA|Then build another. The dead have waited this long.

[specials.shuttle.subs.lost.2]
KASKA|Find out who War paid for this. Quietly.
EMBDIR|Sir, her people swear they had nothing to do with it.
KASKA|They always do. A wolf in sheep's clothing, that one.

; 120 seconds left on the countdown
[specials.shuttle.subs.marks.1.2]
KASKA|Tell Sudentor to be ready the moment we're up.

; 90 seconds left on the countdown
[specials.shuttle.subs.marks.2.2]
EMBDIR|Ninety seconds. Sir, the list from Sudentor came in.
KASKA|Read me the names later. I know who's on it.

; 60 seconds left on the countdown
[specials.shuttle.subs.marks.3.2]
KASKA|Sixty seconds. They've waited years. They can wait a minute.

; 30 seconds left on the countdown
[specials.shuttle.subs.marks.4.2]
EMBDIR|Thirty seconds.
KASKA|No mistakes now.

; 10 seconds left on the countdown
[specials.shuttle.subs.marks.5.2]
KASKA|Ten. ...Open it.

; specials.shuttle.subs.start: 3 exchanges, each said together
[specials.shuttle.subs.start.1]
EMBDIR|Sir, the pad is green. Countdown's running.
KASKA|Good. Keep this channel closed. The locals don't need to hear us.

[specials.shuttle.subs.start.2]
KASKA|Is the payload sealed? ...Good. Nobody opens that crate.

[specials.shuttle.subs.start.3]
KASKA|Comona thinks it's hosting a weather satellite. Let it.

; specials.shuttle.subs.strike: 5 exchanges, each said together
[specials.shuttle.subs.strike.1]
EMBDIR|Bandits inbound. Not ours, sir.
KASKA|War's. Right on time. She was never going to let us fly.

[specials.shuttle.subs.strike.2]
EMBDIR|Sir, those jets carry no markings. Nobody's claiming them.
KASKA|They're War's. A wolf in sheep's clothing never signs her work.

[specials.shuttle.subs.strike.3]
KASKA|Of course she's here. She's wanted this launch dead for months.

[specials.shuttle.subs.strike.4]
KASKA|Let Comona's pilots handle them. That's what they're for.

[specials.shuttle.subs.strike.5]
KASKA|She knows what this launch means. She'd burn the island to stop it.


; ====================================================================================================================
; THE ESCORT: CHARLENE, YORKE, ROCK, ALI, DANIELLE and Comona (C, T, G: see its staff names)
; ====================================================================================================================

[specials.escort]
subtitle = Thank You Pilot, I've sent word to HQ and they've sent two Cargo Vessels into the Area with the Special ZFA-44 Airframes, you can call for their support from the STORE

[specials.escort.text.say.crew.ALI.down]
ALI|No wire to catch me this time! Ejecting!
ALI|Ali's hit! Danielle, I'm out! I'm okay!

[specials.escort.text.say.crew.ALI.landed]
ALI|A runway this long feels like cheating. Ali's down.
ALI|Ali's down. Danielle, I'll wait for you on the apron.

[specials.escort.text.say.crew.ALI.mourn]
DANIELLE|Ali!! You'd better be alive down there, I swear.
DANIELLE|Ali's chute... I see it. Okay. Okay. Who did that?!

[specials.escort.text.say.crew.DANIELLE.down]
DANIELLE|They got me! Count my kills, Yorke! Ejecting!
DANIELLE|Danielle's hit! I'm out! Ali, don't you dare follow me!

[specials.escort.text.say.crew.DANIELLE.landed]
DANIELLE|Danielle on the ground. And I had the most kills.
DANIELLE|Down. Ali, you owe me that dinner.

[specials.escort.text.say.crew.DANIELLE.mourn]
ALI|Danielle! DANIELLE! ...I see her chute. She's okay.
ALI|They hit Danielle. Right. Nobody leaves this sky.

[specials.escort.text.say.crew.ROCK.down]
ROCK|Hit. Going out.
ROCK|I'm done. Ejecting.

[specials.escort.text.say.crew.ROCK.landed]
ROCK|Down.
ROCK|Rock, on the ground. Coffee.

[specials.escort.text.say.crew.ROCK.mourn]
YORKE|Rock's down! ...Damn it. KMG, tighten up.
YORKE|Lost my two. Rock, you'd better be swimming.

[specials.escort.text.say.crew.YORKE.down]
YORKE|I'm hit, I'm hit! Ejecting! Rock, you have the lead!
YORKE|Lost an engine... punching out! Rock, she's yours!

[specials.escort.text.say.crew.YORKE.landed]
YORKE|Yorke's down. A good landing, if I say so myself.
YORKE|Lead on the ground. KMG, bring it in clean.

[specials.escort.text.say.crew.YORKE.mourn]
ROCK|Lead's out. I have the lead. KMG, on me.
ROCK|Yorke's chute is open. Two has the lead. Tighten up.

[specials.escort.text.say.defended_ally]
YORKE|Splash one, off Charlene's six.
YORKE|Bandit down. Close it up, KMG.
ROCK|Got him.
ROCK|Another one. Next.
ALI|Fox two, kill! The navy taught me something after all.
ALI|Splash! Danielle, did you see that?
DANIELLE|Nice one, Ali. Don't let it go to your head.
ROCK|Splash. Lead, her six is clear.
DANIELLE|That's mine. Yorke, count it.
DANIELLE|Splash! Is anybody else keeping score?
CHARLENE|My escorts, everyone. Worth every zollar.
CHARLENE|Good work, Kokoda. That's why you're on retainer.

[specials.escort.text.say.defended_staff]
C|Airfield defences got one. You're welcome, Charlene.
G|The base guns got one! Did you see that?

[specials.escort.text.say.defended_you]
CHARLENE|Splendid shot. Remind me to raise your rate.
CHARLENE|That's the kind of work Kokoda pays for. Well done.
CHARLENE|One less pest. Keep them off my wings.
CHARLENE|Beautiful flying. I may have to hire you.
CHARLENE|Bravo. I'd frame that kill if I could.
CHARLENE|Thank you, pilot. That one was a little too close.
CHARLENE|Lovely. Do that again, as often as you like.

[specials.escort.text.say.escort_down]
CHARLENE|{name} is down! Kokoda takes care of its own. Find that chute!
CHARLENE|We've lost {name}! Comona, mark that ejection!
C|Comona Control: we have {name}'s chute. Rescue is on the way.

; specials.escort.text.say.final: 2 exchanges, each said together
[specials.escort.text.say.final.1]
T|Kokoda B-1B, Comona Tower. Runway zero-seven, cleared to land.
CHARLENE|Cleared to land. Gear down. Keep them off me on final.
YORKE|KMG, hold north of the field. We go in after her.

[specials.escort.text.say.final.2]
T|Charlene, Comona Tower. Wind's calm, runway zero-seven is yours.
CHARLENE|Lovely. Gear coming down. Three green.
DANIELLE|We'll keep the sky clean, Charlene. Go.

[specials.escort.text.say.first_attack]
CHARLENE|Bandits closing on me. How terribly rude.
CHARLENE|They're coming for the Lancer. Of course they are. Look at her.
CHARLENE|Hostiles on my nose. Pilots, this is what my money is for.

; specials.escort.text.say.go: 3 exchanges, each said together
[specials.escort.text.say.go.1]
C|Comona Control to inbound B-1B, identify yourself.
CHARLENE|Charlene, Kokoda Mercenary Group, out of Aurelia. Coming in.
CHARLENE|She's the rarest airframe in my collection. Not a scratch.
YORKE|Yorke, KMG lead. Four of us on her wing.
ROCK|Rock, KMG two. In position.
ALI|Ali here. Smooth skies so far. I hate smooth skies.
DANIELLE|Danielle. Most kills picks dinner. Ali, I'm picking.

[specials.escort.text.say.go.2]
C|B-1B on the south-west approach, you're on our scope.
CHARLENE|Charlene, Kokoda Mercenary Group. I'm landing at Comona. Today.
CHARLENE|There are bandits in this sky, and I am not paying for new paint.
YORKE|KMG escort flight, checking in. Yorke leading.
ROCK|Rock, two, on her left. Nothing gets through.
ALI|Ali, on station. Danielle, you're on my wing. Good.
DANIELLE|Danielle, ready. Ali, eyes on the bandits, not on me.

[specials.escort.text.say.go.3]
C|Comona Control. Kokoda flight, we have you. Come straight in.
CHARLENE|Thank you, Comona. My escorts and I would like a quiet trip.
CHARLENE|Pilots, I pay very well for quiet. Do earn it.
YORKE|Yorke. Formation's tight. Eyes out. Rock, you have the left.
ROCK|Copy, lead. Weapons hot.
ALI|Ali. One Su-33, all wings attached. Danielle checked twice.
DANIELLE|Danielle here. Send them in, I'm bored.

; specials.escort.text.say.her_landed: 3 exchanges, each said together
[specials.escort.text.say.her_landed.1]
CHARLENE|Down and safe. Tell your ground crew: hands off the paint.
G|Crew Chief here. Ma'am, we'll be... very gentle.

[specials.escort.text.say.her_landed.2]
CHARLENE|Parked. Someone fetch me a coffee and a damage report.
G|Coffee's on its way, ma'am. The report may take a while.
YORKE|Charlene's down. KMG, one at a time, let's go.

[specials.escort.text.say.her_landed.3]
T|B-1B on the ground. Welcome to Comona, Charlene.
CHARLENE|Thank you, Tower. Now bring my people down.

[specials.escort.text.say.hit]
CHARLENE|I'm hit! That was a very expensive noise.
CHARLENE|Something just bounced off my wing. Pilots!
CHARLENE|They're shooting at a museum piece! Have they no culture?
CHARLENE|Taking fire! Get them off me!
CHARLENE|That one hurt. Somebody will be getting an invoice.
CHARLENE|Hit again! I own ninety aircraft and none of them have a scratch!
CHARLENE|My Lancer is leaking fuel. I am not amused.
CHARLENE|They're on my tail! Kokoda, earn your retainer!

; specials.escort.text.say.hurt_25: 2 exchanges, each said together
[specials.escort.text.say.hurt_25.1]
CHARLENE|Hydraulics failing! If she goes down, so does your bonus!
YORKE|All KMG, collapse on Charlene! Now!

[specials.escort.text.say.hurt_25.2]
CHARLENE|I'm barely holding her! Get me to that runway!
C|Comona Control: crash crews are standing by, Charlene.

; specials.escort.text.say.hurt_50: 2 exchanges, each said together
[specials.escort.text.say.hurt_50.1]
CHARLENE|Half my systems are screaming at me. Pilots, earn your fee!
ROCK|On it.

[specials.escort.text.say.hurt_50.2]
CHARLENE|She's badly hurt. I've rebuilt her once. Never again.
DANIELLE|Nobody touches her. Got it.

; specials.escort.text.say.hurt_75: 2 exchanges, each said together
[specials.escort.text.say.hurt_75.1]
CHARLENE|Paint damage. My restorers are going to weep.
YORKE|Closing up, Charlene. Stay on course.

[specials.escort.text.say.hurt_75.2]
CHARLENE|Three quarters of my airframe left. Let's keep it that way.

; specials.escort.text.say.lost: 2 exchanges, each said together
[specials.escort.text.say.lost.1]
CHARLENE|I'm losing her! Ejecting! My beautiful Lancer...
C|Comona Control: we've lost the B-1B. The escort has failed.

[specials.escort.text.say.lost.2]
CHARLENE|Mayday, mayday! She's gone! Kokoda, get me out of here!
YORKE|Charlene's out! I see her chute. KMG, cover her!

[specials.escort.text.say.staff]
C = COMONA CONTROL
G = CREW CHIEF
T = COMONA TOWER

[specials.escort.text.say.touchdown]
CHARLENE|Wheels down! My insurers will be thrilled.
CHARLENE|Touchdown. Smoother than my last board meeting.
CHARLENE|On the runway. Easy, old girl. Easy.

; specials.escort.text.say.warn_anomaly: 2 exchanges, each said together
[specials.escort.text.say.warn_anomaly.1]
CHARLENE|Pilots, Charlene. My sensors are picking up an Anomaly.
CHARLENE|It'll be on you next round. It scrambles your controls.

[specials.escort.text.say.warn_anomaly.2]
CHARLENE|Kokoda's instruments say an Anomaly is approaching.
CHARLENE|Next round. Trust your instincts, not your stick.

; specials.escort.text.say.warn_glitch: 2 exchanges, each said together
[specials.escort.text.say.warn_glitch.1]
CHARLENE|Pilots, Charlene. An Anomaly is approaching. Something's off.
CHARLENE|It reads like an EA-18G that isn't quite there. Next round.

[specials.escort.text.say.warn_glitch.2]
CHARLENE|My radar keeps losing something. An Anomaly, next round.
CHARLENE|It jumps around. Don't trust where you think it is.

[specials.escort.text.say.wave]
CHARLENE|More of them, from the {dir}! Pilots, please!
CHARLENE|Bandits, {dir}. I didn't fly her out of Aurelia to lose her.
CHARLENE|Another pack from the {dir}. Someone explain my lawyers to them.
CHARLENE|From the {dir} this time. They really do want my collection.
CHARLENE|They're coming from the {dir}. Not one of them near my wings.
YORKE|New contacts, {dir}! KMG, stay on Charlene.
YORKE|Heads up, {dir}! Break them up before they reach her!
ROCK|Contacts, {dir}. Lots of them.
ALI|Bandits from the {dir}! Somebody's popular today.
DANIELLE|More from the {dir}? Good. I was falling behind.
C|Comona Control: new hostiles from the {dir}, closing on the B-1B.
C|Fresh bandits, {dir}. They're going for the bomber.

; specials.escort.text.say.won: 2 exchanges, each said together
[specials.escort.text.say.won.1]
C|Two cargo vessels with ZFA-44s inbound. Call VAMPIRES from the STORE.
YORKE|Good flying, everyone. KMG owes you one.

[specials.escort.text.say.won.2]
C|Confirmed, Charlene. All pilots: VAMPIRES are in the STORE.
DANIELLE|For the record, I had the most kills.


; ====================================================================================================================
; GONE FISHIN': SAL and Comona (S = SAL, C = control, T = tower, G = crew chief)
; ====================================================================================================================

[specials.fishing.text]
bigone_first = S|...
control = COMONA CONTROL
crew = CREW CHIEF
sal = SAL
tower = COMONA TOWER

[specials.fishing.text.ally]
S|Your friend is good too! Tell him the fish are over there.
S|Your friend there has a good eye! The fish fear you both.

[specials.fishing.text.bigone]
S|THE BIG ONE. Forty years I chase him. FORTY YEARS.
S|{kg} kilos! The whole festival eats from one fish!
C|...Okay, that was impressive.
S|I am going to cry. Don't look at me. Just fly.
G|The whole hangar heard that. Everyone wants a photo.

[specials.fishing.text.boat]
S|THAT IS MY BOAT!
S|Not the boat! The boat is not a fish!
S|Hey! I am IN this boat!
S|My BOAT! I just painted her!
S|Aim AWAY from the old man in the boat!

; specials.fishing.text.cleared: 2 exchanges, each said together
[specials.fishing.text.cleared.1]
S|You took all of them? The whole sea is at the festival now!
C|Great. Now there's an environmental report to file.

[specials.fishing.text.cleared.2]
S|Every shoal! The sea is empty! Is that bad? It's a festival!
T|Tower is notifying the fisheries board.

; specials.fishing.text.empties: 3 exchanges, each said together
[specials.fishing.text.empties.1]
S|Maybe aim where the fish are? Just a suggestion.
C|He has a point, and I hate that he has a point.

[specials.fishing.text.empties.2]
S|You are scaring them! Shhh. Quiet bombs.
C|There's no such thing as a quiet bomb, Sal.

[specials.fishing.text.empties.3]
S|The fish are laughing again. I can hear them.
T|Tower can hear them too, Sal.

[specials.fishing.text.first]
S|BOOM! Yes! That is how my grandfather fished. Smaller boom.
S|First fish! My heart, my heart!
S|We have fish! Mama, we have fish!

[specials.fishing.text.grade_a]
S|A fine catch! Come to the festival. Front table.
S|Good work. Not my grandfather's work, but good.
S|Very good! The mayor will shake your hand. Wash it first.

[specials.fishing.text.grade_b]
S|Honest work. Honest fish. The festival will manage.
S|Not bad. Not good. A Tuesday kind of catch.
S|Enough for everyone. Small plates, but everyone.

[specials.fishing.text.grade_c]
S|Soup for the festival. Small soup.
S|Well... the festival cats are happy.
S|We will add a lot of potatoes.

[specials.fishing.text.grade_d]
S|The gulls eat better than this. Next time I call the navy.
S|You blew up more water than fish. The festival weeps.
S|I have seen more fish in my soup. And there's no fish in it.

[specials.fishing.text.grade_s]
S|Legend of the sea! The festival will sing about you.
S|The whole island eats tonight. Free fish for the pilots!
S|I will tell my grandchildren about this. Twice.

[specials.fishing.text.gun]
S|With the little gun! Like a spear fisherman. Respect.
S|Bullets for fish! Very personal. I like it.

[specials.fishing.text.intro]
C|All aircraft, we have an... unusual request on an open channel.
S|Hello? Air force? It's Sal. The festival is in six days!
S|The whole island comes to eat, and I have no fish. None!
C|Sir, this is a military frequency.
S|The fish are hiding. I marked them. You go boom, I collect.
C|...Command approved it. For morale. You have three minutes.
S|Three minutes! Go, go! The festival waits for no one!

[specials.fishing.text.junk]
S|A boot! Only one. Who loses one boot?
S|A shopping cart? Out here? Comona, what are you doing?
S|My old net! Six years I look for that net.
S|A tire. The festival can use it for the ring toss.
S|A toilet seat. I don't want to know.
S|A suitcase! Locked. The festival will open it.
G|Crew Chief: that's our missing toolbox! We'll want that back.
C|Control logs it as... debris. Sure.

[specials.fishing.text.landed]
S|You stop for coffee? The festival doesn't stop for coffee!
G|Crew Chief: we'll turn you around fast. Sal won't stop calling.
S|Why are you on the runway? The fish are in the water!

[specials.fishing.text.mackerel]
S|Mackerel! Now we are fishing!
S|Beautiful mackerel. Pre-cooked, even. Thank you.
S|{kg} kilos! My wife will stop asking where I was.
S|Mackerel! The festival smells better already.
G|Crew Chief: save us some of that mackerel, Sal.

[specials.fishing.text.none]
S|Nothing! You blew up water. The festival can't eat water.
S|Empty. The fish laugh at us now.
S|That was a rock, I think. A dead rock now.
S|My cousin swore the fish were there. My cousin lies.
C|Confirmed kill on... the ocean.
S|Water. Very well done water.
T|Tower saw that splash from here. Nothing in it.
S|You missed so hard the fish are clapping.

[specials.fishing.text.quiet]
S|Hello? Are you fishing or sightseeing?
S|The fish will not explode themselves, my friend.
S|I hear engines. I do not hear fish exploding.
C|Control to pilots: Sal is calling every ten seconds. Please fish.

[specials.fishing.text.sardine]
S|Sardines! Small, but many. Like my family.
S|Little ones! Good for the festival grill.
S|{kg} kilos of sardines. Already in a tin, almost.
S|Sardines! My grandmother's recipe needs exactly this many.
S|Small fish, big heart. Good work.

[specials.fishing.text.signoff]
S|The money is in your accounts. Most of it.
C|Fishing operation complete. Resume normal hostilities.
S|See you at the festival! ...Hello? Hello?
T|Tower: fishing operation closed. Sal, please get off this frequency.
S|Thank you, pilots! I'm naming my next boat after you!
G|Crew Chief: the hangar smells of fish now. Thanks, Sal.

; specials.fishing.text.start: 3 exchanges, each said together
[specials.fishing.text.start.1]
C|Shoals are on your HUD. The fishing grounds are hot.
S|Every kilo feeds Comona. I pay in money. Also in soup.

[specials.fishing.text.start.2]
C|Shoals marked. Weapons free on the... fish.
S|Big ones pay the most. Small ones pay in soup.

[specials.fishing.text.start.3]
T|Tower to all aircraft: the fishing grounds are open. Apparently.
S|Go! The fish don't wait, and neither does my wife!

[specials.fishing.text.swordfish]
S|A swordfish! He wanted to fight. You won.
S|Look at the size of him! The mayor will want a photo.
S|Swordfish! He will be the centrepiece of the festival.
S|Swordfish! He pointed at you first. A fair fight.
C|Control confirms: one very angry swordfish, neutralised.

[specials.fishing.text.time_up]
S|Stop, stop! My boat is full! Let me weigh!
S|Enough! Enough! The boat is sinking with fish!

[specials.fishing.text.tuna]
S|TUNA! Oh, you are good. You are very good.
S|Yellowfin! I am crying a little. It's the salt.
S|{kg} kilos of tuna! The festival will name a dish after you.
C|Sir, please stop cheering on this frequency.
S|Tuna! I owe you a drink. Maybe two.
T|Tower here. Even we cheered for that one.

; specials.fishing.text.warn: 4 exchanges, each said together
[specials.fishing.text.warn.1]
C|Two minutes left on the... fishing operation.
T|Tower: two minutes. Sal's already sharpening his knives.

[specials.fishing.text.warn.2]
S|One minute! Hurry, the gulls are coming!
S|One minute! My wife is watching from the dock!

[specials.fishing.text.warn.3]
S|Thirty seconds! Anything that swims!
S|Thirty seconds! Big ones, small ones, I don't care!

[specials.fishing.text.warn.4]
C|Ten seconds. Wrap it up.
T|Ten seconds, pilots. Then it's Sal's problem.

; specials.fishing.text.weigh: 2 exchanges, each said together
[specials.fishing.text.weigh.1]
S|Okay, okay. Let me see what the festival gets...
S|{kg} kilos total. Hm. Hmm.

[specials.fishing.text.weigh.2]
S|Into the scale. Careful, careful...
S|{kg} kilos. Let me think about this.


; ====================================================================================================================
; THE FESTIVAL: the town, KMG and Comona
; ====================================================================================================================

[specials.festival.text]
control = COMONA CONTROL
crew = CREW CHIEF
sal = SAL
tower = COMONA TOWER

[specials.festival.text.after_chatter]
MC|The band is back on! Give it up for the pilots!
FOOD|Grill's back on. First skewer's free for a flight suit.
MARKET|One lantern broken. I'll call that a good night.
S|I counted the fish twice. All there! The feast goes on!
T|Tower: runway's clear of debris. Thank you, all of you.
G|Crew Chief: refuel, rearm, then go eat. That's an order.
C|Comona Control: radar's quiet. Enjoy the festival.
AUDREY|Valka, the music's back. I do believe you promised me a dance.
VALKA|Audrey, the lanterns look like little missiles. Pretty ones.
AUDREY|Don't stare too hard now. You still got stuff down here to do.
VALKA|Can I have a skewer? And another skewer? Audrey, can I?
AUDREY|As many as you like. But, I get to choose where we sit. Deal?
VALKA|My head's quiet again, Auds. I like it quiet.
AUDREY|I'm happy for you. Here's to many more days like that.

; specials.festival.text.all_down: 2 exchanges, each said together
[specials.festival.text.all_down.1]
C|All bombers down. The skies are clear.
S|The festival goes on! Music! MUSIC!

[specials.festival.text.all_down.2]
C|Last bomber down. Comona is clear.
S|Dance! Everybody dance! The pilots saved the soup!
G|Crew Chief: drinks at the hangar. Pilots first.

[specials.festival.text.chatter]
AUDREY|The fucking gall to interrupt MY date night!
AUDREY|Val, head down already! Are you trying to get yourself hurt?!
VALKA|Audrey says the pilots have this. Audrey is always right.
VALKA|Audrey, you're squeezing my hand. ...No, keep squeezing.
AUDREY|Stop looking at the bombers, Val. Look at me.
AUDREY|Those are...Tu-160s, right? We used to mess with those back in the day.
AUDREY|Hey, how much material up there do you think was made by Grunder? Probably not much nowadays.
AUDREY|One, two, three, four, five...that's enough ways outta here.
AUDREY|Being in a confined space like this during a bombing run...reminds me of Sudentor a bit.
AUDREY|Stars, that was a bit too close!
AUDREY|Unfortunately, my career path doesn't offer much to assist up there...
AUDREY|You know what this reminds me of? A Schenze op. Worst experiences of my life.
AUDREY|Hey. Earth to Valka? You are staring again.
VALKA|Don't worry about the bomber crews. I'll look after them now.
VALKA|I'm not scared. Nobody's ever really gone, you know?
VALKA|Audrey, the sky's very crowded tonight. With people, I mean.
VALKA|The radar plane's called Void Watcher? Cute. Very cute.
AUDREY|Valka, don't go wandering around. I'm not
VALKA|My head's buzzing, Audrey. Like the last time.
AUDREY|Val, deep breaths. You got this.
AUDREY|If you feel it coming, you tell me. No more flying off.
VALKA|War would've loved this raid. ...Don't tell her I said that.
AUDREY|Let's not talk about her right now.
AUDREY|So much for setting up a CloudDirect center here...
MC|This next song is called Please Shoot Down The Missiles!
MC|Comona, give it up for the pilots! Louder than the siren!
FOOD|Free tacos for whoever gets a bomber!
FOOD|I'm not leaving my truck. The grill is still on!
MARKET|My lanterns! Careful with my lanterns!
MARKET|Everything half price if the stall survives!
S|My fish grill is still standing! Keep it that way!
G|Crew Chief: we've got the kids in the hangar. Keep shooting!

[specials.festival.text.formation_down]
C|The {dir} formation is down.
T|Tower confirms: the {dir} bombers are gone!
S|The {dir} ones fell! The crowd is cheering!

[specials.festival.text.impact]
C|Impact on the airfield!
S|My table! They hit my table!
S|Not the dessert tent!
G|Crater on the apron! Crews, move!
S|The fish! Somebody save the fish!
T|Tower's shaking! We're still here!

[specials.festival.text.kmg_after]
YORKE|KMG, stand down. Enjoy the festival, you earned it.
ALI|First time I've seen Comona dance. I could get used to it.
DANIELLE|Somebody save me a seat by the stage. I'm landing hungry.
ROCK|Tell the band to play something loud. We're coming in.

[specials.festival.text.kmg_chatter]
YORKE|KMG, keep the crowd moving. Calm and quick.
ROCK|Hangar's full. Sending the rest behind the trucks.
ROCK|Lead, the kids are in the hangar. All of them.
ALI|Danielle, stay behind me. ...Fine, I'll stay behind you.
DANIELLE|Ali, if a missile ruins this date I'm shooting it myself.
CHARLENE|Someone tell those bombers my collection isn't insured tonight.
CHARLENE|Pilots, the Kokoda Mercenary Group is watching. Impress us.

; specials.festival.text.kmg_raid: 3 exchanges, each said together
[specials.festival.text.kmg_raid.1]
YORKE|KMG, we're grounded. Get the civilians to the hangars. Move.
ROCK|On it, lead.

[specials.festival.text.kmg_raid.2]
CHARLENE|My Lancer is parked forty metres from that runway. Shoot them down!
YORKE|You heard her, pilots.

[specials.festival.text.kmg_raid.3]
DANIELLE|Ali, our first night off in a month. Of course.
ALI|Stay close. ...Closer. Okay, that's close.

; specials.festival.text.kmg_saved: 3 exchanges, each said together
[specials.festival.text.kmg_saved.1]
YORKE|Good work, pilots. KMG owes Comona a round of drinks.
ROCK|Two rounds.

[specials.festival.text.kmg_saved.2]
DANIELLE|Ali. The band's back. You promised me a dance.
ALI|I did. Lead the way.

[specials.festival.text.kmg_saved.3]
CHARLENE|Splendid. Now, where was I? Ah, yes. The fish.

; specials.festival.text.kmg_talk: 2 exchanges, each said together
[specials.festival.text.kmg_talk.1]
CHARLENE|Comona, Kokoda thanks you for your hospitality. The fish is divine.
YORKE|KMG's on the ground and off duty. Mostly.
ROCK|Mostly.

[specials.festival.text.kmg_talk.2]
CHARLENE|I've been to festivals in Aurelia. None with this much fish.
DANIELLE|Ali, they have a dance floor. You're dancing.
ALI|...I'm dancing.

[specials.festival.text.launch]
C|Missile launch from the {dir}! Cruise missiles inbound!
T|Tower: launches from the {dir}! Everybody off the runway!
S|Something is flying at us from the {dir}! Fireworks?!

[specials.festival.text.launch_again]
C|Another salvo from the {dir}!
C|They're launching again, {dir}!
G|More from the {dir}! Get the crowd into the hangars!

; specials.festival.text.raid_town: 3 exchanges, each said together
[specials.festival.text.raid_town.1]
VALKA|Audrey? Is that... an air raid siren? It's so loud.
AUDREY|What else could it be? Now, follow me.

[specials.festival.text.raid_town.2]
MC|Folks, please remain calm! The band will keep playing!
AUDREY|Valka, with me. Stay close and do exactly what I say. No wandering off.

[specials.festival.text.raid_town.3]
FOOD|Everybody behind the trucks! Mind the grill!
AUDREY|You heard him, let's go!

; specials.festival.text.saved_town: 5 exchanges, each said together
[specials.festival.text.saved_town.1]
AUDREY|There. I told you they'd get them. Now, Valka, I believe you owe me a dance.
VALKA|...Yes, Audrey.

[specials.festival.text.saved_town.2]
MC|Comona, the pilots saved the festival! Hit it, band!
AUDREY|Valka, hurry up!
VALKA|Coming, Audrey! ...Bye, bomber people. Rest well.

[specials.festival.text.saved_town.3]
VALKA|Audrey? You can let go of my hand now.
AUDREY|I think I will hold on just a bit longer.

[specials.festival.text.saved_town.4]
VALKA|All those crews... I'll go visit them. They seem lonely.
AUDREY|Right, you can do it later. You don't want to leave me hanging, right?

[specials.festival.text.saved_town.5]
VALKA|See? I stayed me the whole time, Audrey.
AUDREY|One step on a long, arduous journey. I am proud of you.

[specials.festival.text.shot_first]
S|You shot it! The grill is safe!
S|Boom in the sky, not on my tent! Good!

; specials.festival.text.talk: 2 exchanges, each said together
[specials.festival.text.talk.1]
C|All aircraft, the festival at Comona Airport has begun.
S|Pilots! The whole island is here! Look at all this fish!
S|{kg} kilos you caught for us. They named a soup after you.
MC|Good evening, Comona! This first song is for the pilots up there!
C|On behalf of the island: thank you, pilots.
S|Come down! Eat! Dance! The sun is setting, it's perfect.
C|...Wait. Radar contacts. North, west and south.
C|Tu-160s! Air raid! All aircraft, defend the festival!

[specials.festival.text.talk.2]
T|Comona Tower to all aircraft: the festival is open. Enjoy the view.
S|Pilots! Look down! Lanterns, music, and so much fish!
S|{kg} kilos of your fish on the grills. The mayor cried.
AUDREY|Valka, wave at the pilots. ...Properly, Valka. Thank you.
G|Crew Chief: the hangar's full of tables. Sal's cousins are everywhere.
S|At sunset we eat. At night we dance. Tomorrow we sleep!
C|...Hold on. Multiple contacts. North, west and south.
C|Tu-160s, inbound on the festival! All aircraft, engage!

[specials.festival.text.talk_nokg]
S|Every kilo you caught is on a plate tonight.
S|Every fish you caught is on a grill tonight.

; specials.festival.text.timeout: 2 exchanges, each said together
[specials.festival.text.timeout.1]
C|The bombers are turning for home. Let them go.

[specials.festival.text.timeout.2]
C|The raid's breaking off. Hold your fire.
S|They run! Go home, and tell your friends about our fish!


