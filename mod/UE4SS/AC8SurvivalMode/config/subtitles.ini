AUDREY|Goddamnit, let's see if I still have a connection...
AUDREY|Hey, Val, it's me. I've come for you.

[specials.valka.text.say.audrey_30.2]
AUDREY|Hey, whoever is up there on this frequency, bring her down. Gently, if you can.
AUDREY|I'll try to calm her down.

; specials.valka.text.say.audrey_60: 2 exchanges, each said together
[specials.valka.text.say.audrey_60.1]
AUDREY|Val? Val, it's me. I am here and safe. You can come down now.
C|Unknown voice on this frequency. ...Who is that?

[specials.valka.text.say.audrey_60.2]
AUDREY|Val, can you hear me? It's Auds. It's okay. Come home.
C|Unidentified transmission. Who's on this channel?
AUDREY|Nobody of your concern.

; specials.valka.text.say.down: 2 exchanges, each said together
[specials.valka.text.say.down.1]
AUDREY|Stars, this patch of ground sucks.
AUDREY|...There you are. I've got you, Valka. Let's get you home.
C|The contact's gone. Signal lost. ...Whoever that was.

[specials.valka.text.say.down.2]
