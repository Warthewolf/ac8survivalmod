[specials.valka.text.say.reveal.2]
C|What is that? It wasn't on any scope. It wasn't anywhere.

; specials.valka.text.say.reveal_charlene: 2 exchanges, each said together
[specials.valka.text.say.reveal_charlene.1]
CHARLENE|My sensors read nothing. Nothing at all. That isn't possible.

[specials.valka.text.say.reveal_charlene.2]
CHARLENE|I couldn't see her coming. Pilots, I'm so sorry.


